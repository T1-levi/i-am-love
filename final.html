<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sorpresa 💌</title>

<style>
body {
    background: linear-gradient(135deg, #ff4d6d, #000);
    color: white;
    text-align: center;
    font-family: Arial;
    overflow-x: hidden;
}

h1 {
    margin-top: 30px;
    animation: latido 1.5s infinite;
}

@keyframes latido {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

/* GALERÍA HORIZONTAL */
.galeria {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin: 30px;
    flex-wrap: wrap;
}

/* CADA FOTO CON CORAZONES */
.foto-container img {
    width: 300px;
    height: 300px;        /* mismo alto para todas */
    object-fit: cover;    /* recorta sin deformar */
    border-radius: 15px;
    margin: 0 10px;
    box-shadow: 0 0 15px pink;
    transition: transform 0.3s;
}
/* CORAZONES LATERALES */
.lado {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 18px;
}

/* IMÁGENES */
.foto-container img {
    width: 200px;
    border-radius: 15px;
    margin: 0 10px;
    box-shadow: 0 0 15px pink;
    transition: transform 0.3s;
}

.foto-container img:hover {
    transform: scale(1.1);
}

/* corazones flotando */
.heart {
    position: fixed;
    color: pink;
    animation: subir 5s linear infinite;
}

@keyframes subir {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<h1>💌 FELIZ CUMPLEAÑOS CATALINA  💖</h1>

<p>Lo más lindo somos nosotros y nuestro momentos juntos  💕</p>

<div class="galeria">

    <!-- FOTO 1 -->
    <div class="foto-container">
        <div class="lado">💖 💕 </div>
        <img src="foto1.jpeg">
        <div class="lado">💗 💕 </div>
    </div>

    <!-- FOTO 2 -->
    <div class="foto-container">
        <div class="lado">💖 💘 </div>
        <img src="foto2.jpeg">
        <div class="lado">💕 💘 </div>
    </div>

    <!-- FOTO 3 -->
    <div class="foto-container">
        <div class="lado">💗 💖 </div>
        <img src="foto3.jpeg">
        <div class="lado">💕 💖 </div>
    </div>

</div>

<p>
Gracias por cada momento contigo, a tu lado siempre es especial aunque son muy pocas veces que nos vemos💖<br><br>
Espero te halla gustado, este es mi regalo especial, Teamo catita ❤️
</p>

<script>
// corazones flotando
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerText = "💖";
    heart.style.left = Math.random() * 100 + "vw";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}, 300);
</script>

</body>
</html>
